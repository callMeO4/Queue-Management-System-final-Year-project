<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Queue Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 420px; margin: 40px auto; background: white; padding: 28px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a365d; font-size: 22px; margin-top: 0; text-align: center; }
        p.sub { color: #4a5568; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #2d3748; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e0;
            border-radius: 4px; font-size: 14px;
        }
        .btn-submit {
            width: 100%; background: #3182ce; color: white; border: none; padding: 11px;
            border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .btn-submit:hover { background: #2b6cb0; }
        .alert-error {
            background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;
            padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 14px;
        }
        .footer-links { text-align: center; margin-top: 18px; font-size: 14px; }
        .footer-links a { color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Queue System Sign In</h1>
        <p class="sub">Sign in as a Teller or Admin to manage counters, or as a Customer.</p>

        {% if error_message %}
        <div class="alert-error">{{ error_message }}</div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}{% if next_url %}?next={{ next_url|urlencode }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" id="id_username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" id="id_password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="footer-links">
            <a href="{% url 'service_selection' %}">Continue as Walk-In Customer</a>
        </div>
    </div>
</body>
</html>
